name: Validate Architecture Model

on:
  pull_request:
    paths:
      - 'model/**'
      - 'examples/*/model/**'
      - 'solutions/*/output/**'
      - 'examples/*/solutions/*/output/**'
  push:
    branches: [main]
    paths:
      - 'model/**'
      - 'examples/*/model/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
          - model/
          - examples/order-management/model/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - run: npm ci

      - name: Validate ${{ matrix.workspace }}
        run: npx likec4 validate ${{ matrix.workspace }}

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: npm ci
      - name: Check formatting
        run: |
          npx likec4 format model/
          npx likec4 format examples/order-management/model/
          git diff --exit-code || (echo "Files are not formatted. Run 'npm run format' locally." && exit 1)

  adr-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint ADR front matter
        run: |
          echo "=== Checking ADR front matter ==="
          FAIL=0

          for adr in docs/adr/ADR-*.md; do
            [[ -f "$adr" ]] || continue
            echo "Checking: $adr"

            # Must have status field
            if ! grep -q '^status:' "$adr"; then
              echo "  ERROR: missing status field"
              FAIL=1
            fi

            # If Accepted, must have approval block
            if grep -q '^status: Accepted' "$adr"; then
              if ! grep -q 'reference:' "$adr"; then
                echo "  ERROR: Accepted ADR missing approval.reference"
                FAIL=1
              fi
            fi

            # Cross-references: supersedes and superseded-by must match
            SUPERSEDES=$(grep '^supersedes:' "$adr" | sed 's/supersedes: *//')
            SUPERSEDED_BY=$(grep '^superseded-by:' "$adr" | sed 's/superseded-by: *//')

            if [[ "$SUPERSEDES" != "[]" ]] && [[ "$SUPERSEDES" != "" ]]; then
              echo "  supersedes: $SUPERSEDES"
            fi
            if [[ "$SUPERSEDED_BY" != "[]" ]] && [[ "$SUPERSEDED_BY" != "" ]]; then
              echo "  superseded-by: $SUPERSEDED_BY"
            fi
          done

          if [[ $FAIL -ne 0 ]]; then
            echo "ADR lint failed"
            exit 1
          fi
          echo "ADR lint passed"

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run smoke tests
        run: bash tests/smoke-test.sh

  export-diagrams:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, smoke-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Export Order Management diagrams
        run: npx likec4 export png examples/order-management/model/ -o examples/order-management/export/ --flat
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update exported diagrams [skip ci]'
          file_pattern: 'examples/*/export/*.png'
